# ============================================
# 数据库智能平台 - Nginx 配置
# 文件路径: /etc/nginx/conf.d/dbops.conf
# ============================================

server {
    listen 80;
    server_name localhost;           # 改为实际域名或IP
    charset utf-8;

    # 前端静态文件目录（改为实际部署路径）
    root /opt/dbops/frontend/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 前端 SPA 路由（Vue Router history模式）
    location / {
        try_files $uri $uri/ /index.html;
        # 缓存HTML不缓存（确保总能获取最新）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源缓存（JS/CSS/图片）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 代理后端 API
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # 跨域（如前后端不同域时使用）
        # add_header Access-Control-Allow-Origin  *;
        # add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS";
        # add_header Access-Control-Allow-Headers "Authorization,Content-Type";
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # 安全 Headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 日志
    access_log /var/log/nginx/dbops_access.log;
    error_log  /var/log/nginx/dbops_error.log;
}
