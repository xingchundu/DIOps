# ============================================
# 数据库智能平台 - Nginx 配置
# 文件路径: /etc/nginx/conf.d/dbops.conf
# ============================================

# HTTP 自动跳转 HTTPS
server {
    listen 80;
    server_name localhost;           # 改为实际域名或IP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost;           # 改为实际域名或IP
    charset utf-8;

    # SSL 证书（改为实际部署路径，与 scripts/gen-ssl-cert 生成的一致）
    ssl_certificate     /opt/dbops/certs/server.crt;
    ssl_certificate_key /opt/dbops/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态文件目录（改为实际部署路径）
    root /opt/dbops/frontend/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 上传上限（知识库 PDF、CMDB Excel、巡检脚本等；nginx 默认 1MB 会直接 413）
    client_max_body_size 50m;

    # 安全 Headers（server 级）
    # 注意：nginx 的 add_header 只要 location 里出现任何一条，就不再继承 server 级的 add_header，
    #      所以下面每个自带 add_header 的 location 都重复了这组安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端 SPA 路由（Vue Router history模式）
    location / {
        try_files $uri $uri/ /index.html;
        # 缓存HTML不缓存（确保总能获取最新）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 静态资源缓存（JS/CSS/图片）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SQL 优化 Agent（SSE 流式输出，LLM 生成可能持续数分钟）：关闭缓冲，长超时
    location /api/sql-agent/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # 知识库入库（分块向量化，大文档较慢）
    location ~ ^/api/ai/knowledge(/upload|/[0-9]+/reindex)?$ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # 长任务：备份/恢复、巡检、发布执行/回滚、HA 切换、故障自愈、部署执行、AWR/报表、SQL 采集与优化、AI 分析
    location ~ ^/api/(automation/(backup|inspect|publish|ha|fault)/|deploy/jobs/[0-9]+/execute|monitor/instances/[0-9]+/(awr-report|tablespaces|tablespace-diagnostics|performance)|monitor/report|sql/capture/|sql-review/tickets/[0-9]+/(auto-audit|review|push-to-publish|assign)|sql-diag/run|sql-insight/(collect|optimize|tickets|audit|anomalies/[0-9]+/diagnose)|ai/(chat|rca|anomaly|cluster)|diagnostics/) {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # 代理后端 API（普通请求）
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # 日志
    access_log /var/log/nginx/dbops_access.log;
    error_log  /var/log/nginx/dbops_error.log;
}
